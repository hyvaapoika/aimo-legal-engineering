[build]
builder = "dockerfile"
dockerfile = "infra/Dockerfile"

[deploy]
startCommand = "pnpm start"
healthcheckPath = "/health"
healthcheckTimeout = 100
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 10

[[services]]
name = "aimo-gateway"
source = "."

[[services.postgres]]
name = "aimo-postgres"
