services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: aimo
      POSTGRES_PASSWORD: local-development-only
      POSTGRES_DB: aimo
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - aimo-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aimo -d aimo"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  aimo-postgres:
